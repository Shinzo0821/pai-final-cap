env:
  _target_: capx.envs.tasks.franka.franka_nut_assembly.FrankaNutAssemblyCodeEnv
  cfg:
    _target_: capx.envs.tasks.base.CodeExecEnvConfig
    low_level: franka_robosuite_nut_assembly_low_level
    privileged: true
    apis:
    - FrankaControlNutAssemblyPrivilegedApi_Noisy
    oracle_code: "\nimport numpy as np\n_pai_g = get_object_pose\ndef get_object_pose(name,\
      \ *a, **k):\n    rs = [_pai_g(name, *a, **k) for _ in range(30)]\n    return\
      \ (np.mean([r[0] for r in rs], axis=0),) + tuple(rs[0][1:])\nif \"sample_grasp_pose\"\
      \ in globals():\n    _pai_s = sample_grasp_pose\n    def sample_grasp_pose(name,\
      \ *a, **k):\n        rs = [_pai_s(name, *a, **k) for _ in range(30)]\n     \
      \   return (np.mean([r[0] for r in rs], axis=0),) + tuple(rs[0][1:])\n\nimport\
      \ numpy as np\nfrom scipy.spatial.transform import Rotation as R\n\ndef pose_to_matrix(pos,\
      \ quat):\n    rot = R.from_quat([quat[1], quat[2], quat[3], quat[0]])  # scipy\
      \ expects xyzw\n    mat = np.eye(4)\n    mat[:3, :3] = rot.as_matrix()\n   \
      \ mat[:3, 3] = pos\n    return mat\n\ndef matrix_to_pose(mat):\n    pos = mat[:3,\
      \ 3]\n    rot = R.from_matrix(mat[:3, :3])\n    quat_xyzw = rot.as_quat()\n\
      \    quat_wxyz = np.array([quat_xyzw[3], quat_xyzw[0], quat_xyzw[1], quat_xyzw[2]])\n\
      \    return pos, quat_wxyz\n\ndef flip_xy_axis(mat: np.ndarray) -> np.ndarray:\n\
      \    # mat is a 3x3 rotation matrix\n    flip_mat = np.array(\n        [[-1,\
      \ 0, 0],\n         [0, -1, 0],\n         [0, 0, 1]]\n    )\n    return mat @\
      \ flip_mat\n\n# 1. Sample grasp pose for nut (handle)\nhandle_pos, handle_quat\
      \ = sample_grasp_pose(\"extruded handle of the brown square nut\")\n\n# 2. Get\
      \ poses of nut (center) and peg\nnut_pos, _ = get_object_pose(\"white hollow\
      \ center of the brown square nut\")\npeg_pos, peg_quat = get_object_pose(\"\
      square block\")\n\n# 4. Compute transform from handle to nut center\nv_world\
      \ = nut_pos - handle_pos\nhandle_orientation = R.from_quat([handle_quat[1],\
      \ handle_quat[2], handle_quat[3], handle_quat[0]]).as_matrix()\nprint(\"direction\
      \ of handle: \", v_world @ handle_orientation[:, 0])\nif v_world @ handle_orientation[:,\
      \ 0] < 0:\n    print(\"flipping the xy axis\")\n    # flip the xy axis \n  \
      \  handle_orientation = flip_xy_axis(handle_orientation)\n    handle_xyzw =\
      \ R.from_matrix(handle_orientation).as_quat()\n    handle_quat = np.array([handle_xyzw[3],\
      \ handle_xyzw[0], handle_xyzw[1], handle_xyzw[2]])\nelse:\n    print(\"x axis\
      \ direction is correct\")\n\n# 3. Execute motion: open gripper, go to grasp\
      \ pose, close, then insert\ngoto_pose(handle_pos, handle_quat, z_approach=0.05)\
      \  # approach from above\nclose_gripper()\n\n# 3.5. Return to home joint position\
      \ so that it can have a better ik solve\ngoto_home_joint_position()\n\nT_handle\
      \ = pose_to_matrix(handle_pos, handle_quat)\nT_nut = pose_to_matrix(nut_pos,\
      \ handle_quat)\nT_handle_to_center = np.linalg.inv(T_nut) @ T_handle\n\n# 5.\
      \ Compute desired handle pose for insertion onto peg\nT_peg = pose_to_matrix(peg_pos,\
      \ peg_quat)\nT_desired_handle = T_peg @ T_handle_to_center\ndesired_handle_pos,\
      \ desired_handle_quat = matrix_to_pose(T_desired_handle)\n\n# 6. Final insertion:\
      \ move slightly along z to ensure contact\ngoto_pose(desired_handle_pos, desired_handle_quat,\
      \ z_approach=0.05)  # approach to pe\nfinal_pos = desired_handle_pos + np.array([0,\
      \ 0, -0.02])  # lower 2 cm\ngoto_pose(final_pos, desired_handle_quat, z_approach=0.0)\
      \  # final insertion\n\n# 7. Release nut if needed\nopen_gripper()\n"
api_servers:
- _target_: capx.serving.launch_pyroki_server.main
  port: 8116
  host: 127.0.0.1
  robot: panda_description
  target_link: panda_hand
record_video: true
output_dir: ./outputs/pai_noisy_nut
use_oracle_code: false
trials: 100
num_workers: 12
