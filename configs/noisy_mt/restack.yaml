# generated by scripts/make_configs.py from env_configs/cube_restack/franka_robosuite_cube_restack_privileged.yaml (cond=noisy_mt)
env:
  _target_: capx.envs.tasks.franka.franka_cube_restack.FrankaRestackCodeEnv
  cfg:
    _target_: capx.envs.tasks.base.CodeExecEnvConfig
    low_level: franka_robosuite_cubes_restack_low_level
    privileged: true
    apis:
    - FrankaControlPrivilegedApi_Noisy
    multi_turn_prompt: 'The following code blocks were just executed:

      ```python

      {executed_code}

      ```

      The current console stdout is:

      ```

      {console_stdout}

      ```

      The current console stderr is:

      ```

      {console_stderr}

      ```

      If there were no errors during compilation or execution, the console stderr
      will be empty. If there were errors, consider regenerating the code.

      Consider querying the environment state through tool calls and prints to see
      if the task is completed.

      Please respond with EXACTLY ONE of the following:

      - The word ''REGENERATE'' followed immediately by new Python code in a fenced
      code block (```python...```) if you want to modify the code.

      - The word ''FINISH'' if the task appears to be complete

      '
api_servers:
- _target_: capx.serving.launch_pyroki_server.main
  port: 8116
  host: 127.0.0.1
  robot: panda_description
  target_link: panda_hand
record_video: true
output_dir: ./outputs/pai_noisy_mt_restack
trials: 100
num_workers: 12
use_legacy_multi_turn_decision_prompt: true
